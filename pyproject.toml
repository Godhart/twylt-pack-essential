[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "twylt-pack-essential"
version = "0.2.0"
description = "Essential TWYLT tools and their shared HTTP implementation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["twylt>=1.1.0,<2", "pydantic>=2,<3"]
[project.optional-dependencies]
test = ["pytest>=8"]
[tool.hatch.build.targets.wheel]
packages = ["src/twylt_pack_essential"]
